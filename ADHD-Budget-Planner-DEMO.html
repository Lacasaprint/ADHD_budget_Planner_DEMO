/* ---------- habits month engine ---------- */
function ymKey(y,m){ return y+'-'+pad2(m+1); }
function ensureHMonth(y,m){
  const k = ymKey(y,m);
  if(db.habits.months[k]) return db.habits.months[k];
  // carry habits (names/goals/colors) from the most recent earlier month
  const keys = Object.keys(db.habits.months).sort();
  const prevKey = keys.filter(kk => kk < k).pop();
  const prev = prevKey ? db.habits.months[prevKey] : null;
  const habits = prev ? prev.habits.map(h=>({id:h.id,name:h.name,goal:h.goal,color:h.color})) : [];
  db.habits.months[k] = { habits, checks:{} };
  save();
  return db.habits.months[k];
}
function habitCheck(hm, hid, day){ return !!(hm.checks[hid] && hm.checks[hid][day]===1); }
function habitState(hm, hid, day){
  const v = hm.checks[hid] ? hm.checks[hid][day] : 0;
  return v===2 ? 2 : (v===1 ? 1 : 0);   // 0 clear · 1 done · 2 skipped
}
function setHabitState(hm, hid, day, st){
  if(!hm.checks[hid]) hm.checks[hid] = {};
  if(st===0) delete hm.checks[hid][day]; else hm.checks[hid][day] = st;
  save();
}
function cycleHabitDay(hm, hid, day){
  setHabitState(hm, hid, day, (habitState(hm,hid,day)+1)%3);  // clear → done → skipped → clear
}
function habitMonthStats(hm, y, m){
  const dim = new Date(y, m+1, 0).getDate();
  const n = hm.habits.length || 1;
  let done = 0, total = 0, perfect = 0, skipped = 0;
  const perDay = Array.from({length:dim},()=>0);
  const dones = {}, skips = {};
  for(const h of hm.habits){
    const ch = hm.checks[h.id] || {};
    let dCount=0, sCount=0;
    for(let dd=1; dd<=dim; dd++){
      total++;
      if(ch[dd]===1){ done++; perDay[dd-1]++; dCount++; }
      else if(ch[dd]===2){ skipped++; sCount++; }
    }
    dones[h.id]=dCount; skips[h.id]=sCount;
  }
  for(let dd=1; dd<=dim; dd++){ if(perDay[dd-1]===n && n>0) perfect++; }
  // streaks per habit (done-only, consecutive days ending today or yesterday)
  const streaks = {}, bests = {};
  for(const h of hm.habits){
    const ch = hm.checks[h.id] || {};
    let s = 0, dd = TODAY.getDate();
    if(fromIso(ymKey(y,m)+'-'+pad2(Math.min(dd,dim))) .getTime() !== TODAY.getTime() || m!==TODAY.getMonth() || y!==TODAY.getFullYear()) dd = dim;
    if(ch[dd]!==1) dd--;                       // allow streak counting from yesterday
    while(dd>=1 && ch[dd]===1){ s++; dd--; }
    streaks[h.id]=s;
    let b=0, run=0;
    for(let i=1;i<=dim;i++){ if(ch[i]===1){ run++; b=Math.max(b,run);} else run=0; }
    bests[h.id]=b;
  }
  return { pct: total? Math.round(done/total*100):0, done, total, skipped, perfect, perDay, streaks, bests, dim, dones, skips };
}

/* ---------- recurring engine ---------- */
function recDueOn(rec, dIso){
  const d = fromIso(dIso);
  if(rec.freq==='daily')  return true;
  if(rec.freq==='weekly') return rec.weekdays.includes(d.getDay());
  if(rec.freq==='monthly')return d.getDate()===rec.monthDay;
  if(rec.freq==='every')  { const a = diffD(dIso, rec.anchor||'2026-01-01'); return a>=0 && a % rec.everyN===0; }
  return false;
}
function recAdvance(rec, doneIso){
  let base = fromIso(doneIso > rec.nextDue ? doneIso : rec.nextDue);
  if(rec.freq==='daily'){ base = addD(base,1); }
  else if(rec.freq==='weekly'){
    do{ base = addD(base,1); } while(!rec.weekdays.includes(base.getDay()));
  } else if(rec.freq==='monthly'){ base = addM(base,1); }
  else if(rec.freq==='every'){ base = addD(base, rec.everyN); }
  rec.nextDue = iso(base); rec.lastDone = doneIso;
}

/* ---------- derived daily aggregations ---------- */
function tasksDueOn(dIso){ return db.tasks.filter(t=>!t.done && t.due===dIso); }
function tasksOpenOverdue(){ return db.tasks.filter(t=>!t.done && t.due && diffD(t.due,todayIso())<0); }
function glasses(n){ return clamp(n, 0, 99); }
function monthSpend(){
  const ym = todayIso().slice(0,7);
  let exp=0, inc=0;
  for(const x of db.budget.log){
    if(!x.date.startsWith(ym)) continue;
    if(x.type==='inc') inc+=x.amount; else exp+=x.amount;
  }
  return {exp, inc};
}
function weekMinutes(){
  const mon = iso(startOfWeek(TODAY,1));
  let mins=0;
  for(const w of db.workouts) if(w.date>=mon) mins += w.minutes;
  return mins;
}

/* ---------- svg chart helpers ---------- */
function donutSVG(size, stroke, segs, centerTop, centerSub){
  // segs: [{pct, color}] — remainder renders as track
  const r = (size - stroke)/2, cx = size/2, cy = size/2;
  let off = 0, rings = '';
  for(const s of segs){
    const pct = clamp(s.pct, 0, 100);
    rings += `<circle class="fill" cx="${cx}" cy="${cy}" r="${r}" pathLength="100" style="stroke:${s.color}" stroke-width="${stroke}" fill="none" stroke-dasharray="${pct} ${100-pct}" stroke-dashoffset="${-off}" stroke-linecap="butt"/>`;
    off += pct;
  }
  return `<span class="donut"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle class="track" cx="${cx}" cy="${cy}" r="${r}" pathLength="100" stroke-width="${stroke}"/>${rings}</svg>
    <span class="dval">${centerTop||''}${centerSub?`<small>${centerSub}</small>`:''}</span></span>`;
}
function vbars(opts){
  // {w,h,vals,labels,color,colorFn,max,goal,fmt} → svg string
  const {w,h,vals,labels} = opts;
  const max = opts.max || Math.max(1, ...vals);
  const n = vals.length || 1;
  const padB = 18, padT = opts.goal ? 8 : 4;
  const cw = w/n, bw = Math.min(26, cw*0.56);
  let bars='', labs='', grid='';
  for(let i=0;i<n;i++){
    const v = vals[i]||0;
    const bh = Math.max(2, (h-padB-padT) * (v/max));
    const x = i*cw + (cw-bw)/2, y = h-padB-bh;
    const c = opts.colorFn ? opts.colorFn(v,i) : (opts.color||'#BFDDF2');
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="${Math.min(5,bw/2)}" style="fill:${c}"><title>${labels[i]}: ${opts.fmt?opts.fmt(v):v}</title></rect>`;
    labs += `<text x="${(i*cw+cw/2).toFixed(1)}" y="${h-5}" text-anchor="middle" font-size="8.5" font-weight="700" style="fill:#8CA1B0">${labels[i]}</text>`;
  }
  if(opts.goal){
    const gy = h-padB-padT - (h-padB-padT)*(opts.goal/max);
    grid = `<line x1="0" x2="${w}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" style="stroke:#E8AF7C" stroke-width="1.2" stroke-dasharray="4 4"/><text x="${w-2}" y="${gy-3}" text-anchor="end" font-size="8" font-weight="700" style="fill:#B3763F">${opts.fmt?opts.fmt(opts.goal):opts.goal}</text>`;
  }
  return `<svg class="${opts.cls||''}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block">${grid}${bars}${labs}</svg>`;
}
function lineChart(opts){
  // {w,h,vals,labels,color,min,max,unit,padL}
  const {w,h,vals,labels} = opts;
  if(!vals.length) return '<div class="empty">no data yet</div>';
  const padL=opts.padL||30, padR=10, padT=12, padB=20;
  let mn = opts.min!=null?opts.min:Math.min(...vals), mx = opts.max!=null?opts.max:Math.max(...vals);
  if(mn===mx){ mn-=1; mx+=1; }
  const iw = w-padL-padR, ih = h-padT-padB;
  const X = i => padL + (vals.length===1? iw/2 : iw*i/(vals.length-1));
  const Y = v => padT + ih*(1-(v-mn)/(mx-mn));
  let grid='', pts='', labs='';
  for(let g=0; g<4; g++){
    const v = mn + (mx-mn)*g/3, y = Y(v);
    grid += `<line x1="${padL}" x2="${w-padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:#EAF1F7"/>`+
            `<text x="${padL-5}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8" font-weight="700" style="fill:#9DAFBD">${opts.fmt?opts.fmt(v):Math.round(v*10)/10}</text>`;
  }
  const path = vals.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  vals.forEach((v,i)=>{ pts += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.2" style="fill:${opts.color||'#6E93B4'}" stroke="#fff" stroke-width="1.4"><title>${labels[i]}: ${opts.fmt?opts.fmt(v):v}</title></circle>`;
                         labs += `<text x="${X(i).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="8" font-weight="700" style="fill:#8CA1B0">${labels[i]}</text>`; });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block"><line x1="${padL}" x2="${padL}" y1="${padT}" y2="${h-padB}" style="stroke:#EAF1F7"/>${grid}<path d="${path}" fill="none" style="stroke:${opts.color||'#6E93B4'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>${pts}${labs}</svg>`;
}

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(x, y){
  if(REDUCED) return;
  const cv = $('confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#BFDDF2','#F3B8D3','#B9E3DF','#F6D0B5','#DAD9F3','#FFF1CF','#ffffff'];
  const parts = Array.from({length:70},()=>({
    x, y, vx:(Math.random()-.5)*11, vy:-(Math.random()*8+4),
    s:Math.random()*5+3, c:colors[Math.floor(Math.random()*colors.length)],
    r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, life:1
  }));
  const t0 = performance.now();
  (function frame(t){
    const dt = (t-t0)/1000;
    ctx.clearRect(0,0,cv.width,cv.height);
    let alive=false;
    for(const p of parts){
      p.vy += .28; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      p.life = 1 - dt/1.35;
      if(p.life>0 && p.y<cv.height+20){
        alive=true;
        ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.translate(p.x,p.y); ctx.rotate(p.r);
        ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62); ctx.restore();
      }
    }
    if(alive) requestAnimationFrame(frame); else ctx.clearRect(0,0,cv.width,cv.height);
  })(t0);
}
function confettiAt(el){ if(!el) return confettiCenter(); const r=el.getBoundingClientRect(); confetti(r.left+r.width/2, r.top+r.height/2); }
function confettiCenter(){ confetti(innerWidth/2, innerHeight*0.35); }
function armDelete(el, fn){
  if(el.classList.contains('armed')){ fn(); return; }
  el.classList.add('armed'); const old = el.innerHTML; el.innerHTML = 'Sure?';
  setTimeout(()=>{ el.classList.remove('armed'); el.innerHTML = old; }, 2400);
}

function updateBadges(){
  const bP = tasksDueOn(todayIso()).length + tasksOpenOverdue().length;

  if(elP){ elP.textContent = bP; elP.classList.toggle('on', bP>0); }

}

function dSavingsCard(){

function dDebtCard(){

function dMonthProgressCard(){
  const ym=todayIso().slice(0,7);
  const dim=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0).getDate();
  const perDay=Array.from({length:dim},()=>0);
  for(const x of db.budget.log){ if(x.type!=='exp'||!x.date.startsWith(ym)) continue; perDay[Number(x.date.slice(8,10))-1]+=x.amount; }
  let run=0; const cum=[];
  for(let d=0; d<TODAY.getDate(); d++){ run+=perDay[d]; cum.push(Math.round(run)); }
  if(!cum.length || !cum[cum.length-1]) return `<div class="dcard"><div class="dcard-head"><span class="dcard-title">Monthly progress</span>${dOpen('budget')}</div><div class="d-sub">no spending logged yet this month — very peaceful</div></div>`;
  const labels=cum.map((_,i)=>((i+1)===1||(i+1)%5===0)?String(i+1):'');
  return `<div class="dcard"><div class="dcard-head"><span class="dcard-title">Monthly progress · spend so far</span>${dOpen('budget')}</div>
    ${lineChart({w:252,h:76,padL:40,vals:cum,labels,color:'#6E93B4',fmt:v=>'$'+Math.round(v)})}</div>`;
}

function dWeightCard(){
  const wts=wtSorted().slice(-10);

  const vals=wts.map(w=>w.kg);
  const delta=Math.round((vals[vals.length-1]-vals[0])*10)/10;
  const dTxt=delta?` <span style="color:${delta<0?'var(--sage)':'var(--oxb)'}">${delta>0?'+':''}${delta}</span>`:'';
  return `<div class="dcard"><div class="dcard-head"><span class="dcard-title">Weight log · past 30 days</span><span class="dval">${vals[vals.length-1]} kg${dTxt}</span>${dOpen('weight')}</div>

}
function dFitnessCard(){
  const goal=db.settings.fitGoalMin||210, wMin=weekMinutes();

function dHydrationCard(){

function dMoneyHabitsCard(){
  const ym=todayIso().slice(0,7);

ACT['task-add'] = () => openTaskModal();
ACT['task-save'] = () => {
  const label = $('mTaskLabel').value.trim();
  if(!label){ toast('Give the task a name first'); return; }
  db.tasks.push({id:uid(), label, urgent:$('mTaskU').checked, important:$('mTaskI').checked, due:$('mTaskDue').value||'', est:clamp(Math.round(num($('mTaskEst').value,30)||30),5,240), done:false, doneAt:null});

};

ACT['task-save'] = (() => { const orig = ACT['task-save']; return (el) => {
  if(!el.dataset.id){ orig(); return; }

CHG['task-done'] = (el) => {
  const t = db.tasks.find(x=>x.id===el.dataset.id); if(!t) return;
  t.done = el.checked; t.doneAt = t.done? todayIso():null;

let calSelected = todayIso();
function calChipColors(q){ return q==='do'?'c-pink':(q==='sched'?'c-blue':(q==='del'?'c-peach':'c-violet')); }

RENDER.calmonth = function(){
  const first = new Date(calY, calM, 1);
  const start = startOfWeek(first,1);
  const dim = new Date(calY, calM+1, 0).getDate();
  const hm = db.habits.months[ymKey(calY,calM)];
  const cells = [];
  for(let i=0;i<42;i++){
    const d = addD(start,i), dIso = iso(d);
    const out = d.getMonth()!==calM;
    if(i>=35 && out) continue;
    cells.push(cellHTML(d, dIso, out));
  }
  const ym = ymKey(calY,calM);
  const hmStats = hm ? habitMonthStats(hm, calY, calM) : null;
  $('view-calmonth').innerHTML = `
    ${viewHead('Automated · everything lands here', 'Monthly <em>Calendar</em>',
      `<b>${MONTHS[calM]} ${calY}</b> · ${db.tasks.filter(t=>!t.done&&t.due&&t.due.startsWith(ym)).length} open tasks · ${db.recurring.length} recurring streams${hmStats?` · habits <b>${hmStats.pct}%</b>`:''}`,
      `<div class="seg"><button data-act="cal-prev">${icon('chevL')}</button><button data-act="cal-today">Today</button><button data-act="cal-next">${icon('chevR')}</button></div>`)}
    <div class="panel plain">
      <div class="cal-top" style="padding:16px 16px 0">

          <span class="cl"><i style="background:#BFDDF2"></i> schedule</span>
          <span class="cl"><i style="background:#F6D0B5"></i> delegate</span>
          <span class="cl"><i style="background:#DAD9F3"></i> someday</span>
          <span class="cl"><i style="background:#B9E3DF"></i> recurring</span>
          <span class="cl"><i class="cal-dot" style="background:var(--gold)"></i> all habits done</span>
        </div>
      </div>
      <div style="padding:10px 16px 16px">
        <div class="cal-grid">${DOW_SHORT.map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
        <div class="cal-grid">${cells.join('')}</div>
      </div>
    </div>
    <div class="day-detail" id="dayDetail"></div>`;

};
function cellHTML(d, dIso, out){
  const isToday = dIso===todayIso();
  const tasksHere = db.tasks.filter(t=>t.due===dIso);
  const open = tasksHere.filter(t=>!t.done), done = tasksHere.filter(t=>t.done);
  const recs = db.recurring.filter(r=>recDueOn(r,dIso));
  const chkDay = Number(dIso.slice(8,10));
  const hm = db.habits.months[ymKey(d.getFullYear(),d.getMonth())];
  let allDone = false;
  if(hm && hm.habits.length){
    allDone = hm.habits.every(h=>habitCheck(hm,h.id,chkDay));
    if(dIso>todayIso()) allDone=false;
  }
  const chips = open.slice(0,3).map(t=>`<span class="cc ${calChipColors(quadOf(t))}">${esc(t.label)}</span>`).join('')
    + recs.slice(0,3-open.slice(0,3).length).map(r=>`<span class="cc c-teal">↻ ${esc(r.label)}</span>`).join('')
    + done.slice(0,1).map(t=>`<span class="cc c-done">${esc(t.label)}</span>`).join('');
  const extra = (open.length+recs.length) - 3;
  return `<div class="cal-day ${out?'out':''} ${isToday?'today':''} ${calSelected===dIso?'sel':''}" data-act="cal-day" data-date="${dIso}" title="${fmtDateY(dIso)}">
    <span class="dnum">${d.getDate()}</span>
    ${chips}
    ${extra>0?`<span class="cc" style="background:transparent;color:var(--faint);font-weight:800">+${extra} more</span>`:''}
    <div class="cal-foot-row">
      ${allDone?`<span class="cal-dot" style="background:var(--gold)" title="all habits done"></span>`:''}
    </div></div>`;
}

        <div class="chip-label" style="margin-top:12px">That day</div>

/* ============================================================
   MODULE: Weekly Calendar (automated)
   ============================================================ */
RENDER.calweek = function(){
  const start = weekCur;
  const days = Array.from({length:7},(_,i)=>addD(start,i));
  const tIso = todayIso();
  const cols = days.map(d=>{
    const dIso = iso(d), isToday = dIso===tIso;
    const tasks = db.tasks.filter(t=>t.due===dIso);
    const taskHtml = tasks.slice(0,5).map(t=>`<div class="wk-block wb-task ${t.done?'is-done':''}"><span class="wb-t">${esc(t.label)}</span><span class="wb-s">${quadMeta(quadOf(t)).name}</span></div>`).join('');
    const recs = db.recurring.filter(r=>recDueOn(r,dIso)).slice(0,4)
      .map(r=>`<div class="wk-block wb-recur"><span class="wb-t">↻ ${esc(r.label)}</span><span class="wb-s">${r.cat||'routine'}</span></div>`).join('');
    const meal = db.meals.dates[dIso];
    const mealHtml = meal&&meal.d?`<div class="wk-block wb-meal"><span class="wb-cap">dinner</span><span class="wb-t">${esc(meal.d)}</span></div>`:'';
    const spent = db.budget.log.filter(x=>x.date===dIso&&x.type==='exp').reduce((s,x)=>s+x.amount,0);
    const spendHtml = spent? `<div class="wk-block wb-spend"><span class="wb-cap">spent</span><span class="wb-t">${fmtMoney(spent)}</span></div>`:'';
    const wos = db.workouts.filter(w=>w.date===dIso);
    const fitHtml = wos.map(w=>`<div class="wk-block wb-fit"><span class="wb-t">${esc(w.type)} · ${w.minutes}min</span></div>`).join('');
    return `<div class="wk-col ${isToday?'today-col':''}">
      <div class="wk-head"><span class="wd">${DOW_SHORT[d.getDay()===0?6:(d.getDay()+6)%7]}</span><span class="wn">${d.getDate()}</span>${isToday?'<span class="pill gold" style="margin-left:auto">today</span>':''}</div>
      <div class="wk-body">${taskHtml}${recs}${mealHtml}${spendHtml}${fitHtml}</div></div>`;
  }).join('');
  const weekEnd = addD(start,6);
  $('view-calweek').innerHTML = `
    ${viewHead('Automated · your week assembled', 'Weekly <em>Calendar</em>',
      `<b>${fmtDate(iso(start))} – ${fmtDate(iso(weekEnd))}</b> · tasks, recurring, dinners, spend & workouts in one view`,
      `<div class="seg"><button data-act="wk-prev">${icon('chevL')}</button><button data-act="wk-today">This week</button><button data-act="wk-next">${icon('chevR')}</button></div>`)}
    <div class="panel plain"><div class="wk-scroll" style="padding:14px"><div class="wk-grid">${cols}</div></div></div>`;
};
ACT['wk-prev'] = () => { weekCur = addD(weekCur,-7); RENDER.calweek(); };
ACT['wk-next'] = () => { weekCur = addD(weekCur, 7); RENDER.calweek(); };
ACT['wk-today'] = () => { weekCur = startOfWeek(TODAY,1); RENDER.calweek(); };

function goalProg(g){
  const tot = g.steps.length, dn = g.steps.filter(s=>s.done).length;
  return {dn, tot, pct: tot? Math.round(dn/tot*100) : (g.achieved?100:0)};
}
RENDER.goals = function(){
  const act = db.goals.filter(g=>!g.achieved), ach = db.goals.filter(g=>g.achieved);
  const card = g => {
    const p = goalProg(g);
    const dl = g.deadline? diffD(g.deadline, todayIso()) : null;
    return `<div class="goal-card ${g.achieved?'achieved':''}">
      <div class="g-top">
        <span class="g-flag" style="background:${g.color}"><svg viewBox="0 0 24 24" style="stroke:${HAB_DEEPS[HAB_COLORS.indexOf(g.color)]||'#4A7BA6'}"><path d="M5 21V4M5 4h13l-2.5 4L18 12H5"/></svg></span>
        <h4>${esc(g.title)}</h4>

      ${g.why?`<div class="g-why">“${esc(g.why)}”</div>`:''}
      <div class="g-meta">
        ${g.achieved?pill('gold','✿ achieved'): (dl!=null? pill(dl<0?'solid-red':(dl<=7?'red':'blue'), icon('clock')+' '+(dl<0?Math.abs(dl)+'d overdue':(dl===0?'today':'in '+dl+'d'))):'')}
        ${pill('gray', p.dn+'/'+p.tot+' steps')}
      </div>
      <div class="bar"><i class="${p.pct>=100?'ok':''}" style="width:${p.pct}%"></i></div>
      <div class="g-steps">${g.steps.map(s=>`<div class="step ${s.done?'done':''}">
        <label class="check"><input type="checkbox" data-chg="step-toggle" data-g="${g.id}" data-id="${s.id}" ${s.done?'checked':''}><span class="box"></span></label>
        <span class="st-label">${esc(s.t)}</span>

    ${viewHead('Dreams, sliced into doable steps','Goal <em>Planner</em>',

      `<button class="btn btn-primary" data-act="goal-add">${icon('plus')} New goal</button>`)}
    <div class="goal-cards">${act.concat(ach).map(card).join('')||'<div class="panel"><div class="empty">No goals yet — what would feel amazing a month from now?</div></div>'}</div>`;
};

ACT['goal-add'] = () => openGoalModal();
ACT['goal-edit'] = el => openGoalModal(db.goals.find(g=>g.id===el.dataset.id));
ACT['goal-color'] = el => { window._goalColor = el.dataset.c;

CHG['step-toggle'] = el => { const g=db.goals.find(x=>x.id===el.dataset.g); if(!g) return;
  const s=g.steps.find(x=>x.id===el.dataset.id); s.done=el.checked; save();
  if(s.done && goalProg(g).pct===100){ confettiAt(el); toast('Every step done — goal complete?'); }

INP['step-new'] = el => {};
document.addEventListener('keydown', e => {

   MODULE: Habit Tracker
   ============================================================ */
/* ============================================================
   MODULE: Habit Tracker — design-match board
   Rail:  title · month calendar · daily summary
   Main:  completion over time · weekly completion · habits grid
   Tap a day: clear → done (✓) → skipped (×) → clear
   ============================================================ */
let habM = TODAY.getMonth(), habY = TODAY.getFullYear();
let hbSel = null;   // selected day for the daily summary (null = today / 1st)

function hbSmoothPath(pts){
  if(pts.length<2) return '';
  let d=`M${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
    d+=`C${(p1.x+(p2.x-p0.x)/6).toFixed(1)} ${(p1.y+(p2.y-p0.y)/6).toFixed(1)} ${(p2.x-(p3.x-p1.x)/6).toFixed(1)} ${(p2.y-(p3.y-p1.y)/6).toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d;
}
function hbSelDay(st){
  const isCur=habY===TODAY.getFullYear() && habM===TODAY.getMonth();
  const fallback=isCur?TODAY.getDate():1;
  return clamp(hbSel==null?fallback:hbSel,1,st.dim);
}

/* ---------- completion over time (smooth month curve) ---------- */
function hbTimeCard(hm, st){
  if(!hm.habits.length) return `<div class="hb-panel"><div class="hb-panel-head"><span class="hb-panel-title">Completion over time</span></div><div class="hb-empty">add habits to watch your completion curve grow</div></div>`;
  const curYm=ymKey(TODAY.getFullYear(),TODAY.getMonth());
  if(ymKey(habY,habM)>curYm) return `<div class="hb-panel"><div class="hb-panel-head"><span class="hb-panel-title">Completion over time</span></div><div class="hb-empty">this month hasn't started yet — check back soon</div></div>`;
  const n=hm.habits.length;
  const isCur=ymKey(habY,habM)===curYm;
  const lastDay=isCur?TODAY.getDate():st.dim;
  const pcts=[];
  for(let d=1;d<=lastDay;d++) pcts.push(Math.round((st.perDay[d-1]||0)/n*100));
  const avg=Math.round(pcts.reduce((s,v)=>s+v,0)/lastDay);
  const W=640,H=172,padL=36,padR=14,padT=14,padB=26;
  const iw=W-padL-padR, ih=H-padT-padB;
  const X=i=>padL+(lastDay===1?iw/2:iw*i/(lastDay-1));
  const Y=v=>padT+ih*(1-v/100);
  let grid='';
  [0,25,50,75,100].forEach(g=>{
    grid+=`<line x1="${padL}" x2="${W-padR}" y1="${Y(g).toFixed(1)}" y2="${Y(g).toFixed(1)}" style="stroke:var(--chart-grid)"/>`+
          `<text x="${padL-7}" y="${(Y(g)+3).toFixed(1)}" text-anchor="end" font-size="9" font-weight="700" style="fill:var(--chart-lab)">${g}%</text>`;
  });
  let labs='';
  for(let d=1;d<=lastDay;d++){
    if(d===1||d%5===0||d===lastDay)
      labs+=`<text x="${X(d-1).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" font-weight="${d===lastDay?'800':'700'}" style="fill:var(--chart-lab)">${MONTHS[habM].slice(0,3)} ${d}</text>`;
  }
  const pts=pcts.map((p,i)=>({x:X(i),y:Y(p)}));
  const line=`<path d="${hbSmoothPath(pts)}" fill="none" style="stroke:var(--chart-line)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
  const end=pts[pts.length-1];
  const endDot=`<circle cx="${end.x.toFixed(1)}" cy="${end.y.toFixed(1)}" r="7.5" fill="none" style="stroke:var(--chart-line)" stroke-width="1.3" opacity=".5"/><circle cx="${end.x.toFixed(1)}" cy="${end.y.toFixed(1)}" r="3.4" style="fill:var(--chart-line)" stroke="#fff" stroke-width="1.4"/>`;
  return `<div class="hb-panel"><div class="hb-panel-head">
      <span class="hb-panel-title">Completion over time</span>
      <span class="hb-avg">Average ${avg}%</span></div>
    <div class="hb-chart"><svg viewBox="0 0 ${W} ${H}">${grid}${line}${endDot}${labs}</svg></div></div>`;
}

/* ---------- weekly completion % (W1…W5 buckets) ---------- */
function hbWeeksCard(hm, st){
  const curYm=ymKey(TODAY.getFullYear(),TODAY.getMonth());
  const isCur=ymKey(habY,habM)===curYm;
  const n=hm.habits.length||1;
  const lastDay=isCur?TODAY.getDate():st.dim;
  const nW=Math.ceil(st.dim/7);
  const bars=[];
  for(let wi=0;wi<nW;wi++){
    const d1=wi*7+1, d2=Math.min(st.dim,d1+6);
    const upto=Math.min(d2,lastDay);
    let sum=0,cnt=0;
    for(let d=d1;d<=upto;d++){ sum+=Math.round((st.perDay[d-1]||0)/n*100); cnt++; }
    bars.push({v:cnt?Math.round(sum/cnt):null,label:'W'+(wi+1),hot:isCur&&TODAY.getDate()>=d1&&TODAY.getDate()<=d2});
  }
  const W=300,H=152,padL=34,padR=8,padT=18,padB=20;
  const iw=W-padL-padR, ih=H-padT-padB;
  const Y=v=>padT+ih*(1-v/100);
  let grid='';
  [0,25,50,75,100].forEach(g=>{
    grid+=`<line x1="${padL}" x2="${W-padR}" y1="${Y(g).toFixed(1)}" y2="${Y(g).toFixed(1)}" style="stroke:var(--chart-grid)"/>`+
          `<text x="${padL-6}" y="${(Y(g)+2.6).toFixed(1)}" text-anchor="end" font-size="8" font-weight="700" style="fill:var(--chart-lab)">${g}%</text>`;
  });
  const cw=iw/nW, bw=Math.min(26,cw*.5);
  let barsSvg='',labs='';
  bars.forEach((b,i)=>{
    const x=padL+i*cw+(cw-bw)/2, cx=(x+bw/2).toFixed(1);
    if(b.v!=null){
      const bh=Math.max(4,ih*b.v/100);
      barsSvg+=`<text x="${cx}" y="${(padT+ih-bh-5).toFixed(1)}" text-anchor="middle" font-size="8.5" font-weight="800" style="fill:${b.hot?'#C96F3F':'var(--muted)'}">${b.v}%</text>`;
      barsSvg+=`<rect x="${x.toFixed(1)}" y="${(padT+ih-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="${(bw/2).toFixed(1)}" style="fill:${b.hot?'#E58A5A':'#F2C9A4'}"><title>${b.label}: ${b.v}%</title></rect>`;
    }else{
      barsSvg+=`<rect x="${x.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${ih.toFixed(1)}" rx="${(bw/2).toFixed(1)}" style="fill:var(--track);opacity:.55"><title>${b.label}: no data yet</title></rect>`;
    }
    labs+=`<text x="${cx}" y="${H-5}" text-anchor="middle" font-size="8.5" font-weight="${b.hot?'800':'700'}" style="fill:${b.hot?'#C96F3F':'var(--chart-lab)'}">${b.label}</text>`;
  });
  return `<div class="hb-panel"><div class="hb-panel-head">
      <span class="hb-pico">🔥</span><span class="hb-panel-title orange">Weekly completion %</span></div>
    <div class="hb-chart"><svg viewBox="0 0 ${W} ${H}">${grid}${barsSvg}${labs}</svg></div>
    <div class="hb-week-note">Each bar averages one week of ${MONTHS[habM]}${isCur?' — this week highlighted':''}.</div></div>`;
}

/* ---------- rail: month calendar + TODAY button ---------- */
function hbCalCard(st){
  const isCur=habY===TODAY.getFullYear() && habM===TODAY.getMonth();
  const sel=hbSelDay(st);
  const lead=new Date(habY,habM,1).getDay();      // Sunday-first, like the design
  const dimPrev=new Date(habY,habM,0).getDate();
  const trail=(7-(lead+st.dim)%7)%7;
  let cells='';
  for(let i=lead-1;i>=0;i--) cells+=`<span class="hbcal-day out">${dimPrev-i}</span>`;
  for(let d=1;d<=st.dim;d++){
    const isToday=isCur&&d===TODAY.getDate();
    cells+=`<button class="hbcal-day${isToday?' today':''}${(!isToday&&d===sel)?' sel':''}" data-act="hb-selday" data-d="${d}" title="${MONTHS[habM]} ${d}">${d}</button>`;
  }
  for(let d=1;d<=trail;d++) cells+=`<span class="hbcal-day out">${d}</span>`;
  return `<div class="hb-rail-card">
    <div class="hbcal-head">
      <button class="hbcal-nav" data-act="hab-prev" title="Previous month"><svg viewBox="0 0 24 24"><path d="M14.5 5 8 12l6.5 7"/></svg></button>
      <b>${MONTHS[habM]} ${habY}</b>
      <button class="hbcal-nav" data-act="hab-next" title="Next month"><svg viewBox="0 0 24 24"><path d="m9.5 5 6.5 7-6.5 7"/></svg></button>
    </div>
    <div class="hbcal-grid">
      ${['S','M','T','W','T','F','S'].map(w=>`<span class="hbcal-dow">${w}</span>`).join('')}
      ${cells}
    </div>
    <button class="hbcal-today-btn" data-act="hab-today"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>TODAY</button>
  </div>`;
}

/* ---------- rail: daily summary for the selected day ---------- */
function hbSumCard(hm, st){
  const isCur=habY===TODAY.getFullYear() && habM===TODAY.getMonth();
  const sel=hbSelDay(st);
  let done=0, skip=0;
  for(const h of hm.habits){
    const s=habitState(hm,h.id,sel);
    if(s===1) done++; else if(s===2) skip++;
  }
  const pct=hm.habits.length?Math.round(done/hm.habits.length*100):0;
  return `<div class="hb-rail-card">
    <div class="hbsum-title">Daily summary</div>
    <div class="hbsum-row"><span>Completed</span><b>${done}</b></div>
    <div class="hbsum-row"><span>Skipped</span><b>${skip}</b></div>
    <div class="hbsum-row"><span>Completion %</span><b class="rose">${pct}%</b></div>
    <div class="hbsum-foot">${MONTHS[habM].slice(0,3)} ${sel}, ${habY}${isCur&&sel===TODAY.getDate()?' · today':''}</div>
  </div>`;
}

/* ---------- habits grid table ---------- */
function hbTableHTML(hm, st){

  const isCur=habY===TODAY.getFullYear() && habM===TODAY.getMonth();
  if(!n) return `<div class="hb-panel hbtable-panel">
    <div class="hbtable-top"><span class="hbtable-title">Habits · 0</span>
      <button class="hb-addbtn" data-act="hab-add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add habit</button></div>
    <div class="hb-empty">No habits yet — tap <b>+ Add habit</b> and start two-minutes small.</div></div>`;
  const days=Array.from({length:st.dim},(_,i)=>i+1);
  const nums=days.map(d=>`<th class="hnum${isCur&&d===TODAY.getDate()?' hnum-today':''}">${d}</th>`).join('');
  const dows=days.map(d=>`<th class="hdow">${'SMTWTFS'[new Date(habY,habM,d).getDay()]}</th>`).join('');
  const rows=hm.habits.map(h=>{
    const cells=days.map(d=>{
      const s=habitState(hm,h.id,d);
      const future=isCur&&new Date(habY,habM,d)>TODAY;
      const ic=s===1?'<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></svg>':s===2?'<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg>':'';
      const title=future?`no peeking — ${MONTHS[habM].slice(0,3)} ${d} hasn't happened yet`:`${MONTHS[habM].slice(0,3)} ${d} · tap: ✓ done, × skipped, clear`;
      return `<td class="hday"><button class="hcell s${s}" data-act="hab-cell" data-h="${h.id}" data-d="${d}" ${future?'disabled':''} title="${title}">${ic}</button></td>`;
    }).join('');
    return `<tr>
      <td class="hname"><div class="hn-cell">
        <input class="hc-name" value="${esc(h.name)}" placeholder="Habit name" data-inp="hab-name" data-id="${h.id}" aria-label="Habit name">

/* ============================================================
   MODULE: Smart Task Schedule — gentle auto time-blocking
   Open tasks + recurring get laid across the next 7 days.
   Overdue lands first, dated tasks land on/before their due
   day, hardest things go where the morning brain is fresh.
   ============================================================ */
const SMK_SLOTS = [
  ['morning',   9*60, 100],
  ['afternoon',13*60, 130],
  ['evening',  18*60,  70]
];
const SMK_LAB = {
  morning:'Morning · freshest brain',
  afternoon:'Afternoon · keep it moving',
  evening:'Evening · land softly'
};
let smkShuffle = 0;
function smkEst(t){ return clamp(Math.round(num(t.est,30)||30),5,240); }
function smkPlan(){
  const qw = {do:0, sched:1, del:2, later:3};
  const open = db.tasks.filter(t=>!t.done);
  const t0 = todayIso();
  const days = Array.from({length:7},(_,i)=>iso(addD(TODAY,i)));
  const board = days.map(()=>({morning:[],afternoon:[],evening:[]}));
  const dated = open.filter(t=>t.due).sort((a,b)=>{
    if(a.due!==b.due) return a.due<b.due?-1:1;
    return qw[quadOf(a)]-qw[quadOf(b)];
  });
  const undated = open.filter(t=>!t.due).sort((a,b)=> qw[quadOf(a)]-qw[quadOf(b)]);
  for(let i=0;i<smkShuffle && undated.length;i++) undated.push(undated.shift());
  const parked = [];
  function place(t, startIdx){
    const est = smkEst(t);
    for(let di=Math.max(0,startIdx); di<7; di++){
      for(const [slot,,cap] of SMK_SLOTS){
        const used = board[di][slot].reduce((s,x)=>s+smkEst(x.t),0);
        if(used + est <= cap || used===0){
          board[di][slot].push({t, est});
          return true;
        }
      }
    }
    return false;
  }
  for(const t of dated){
    const idx = t.due < t0 ? 0 : Math.min(6, Math.max(0, diffD(t.due, t0)));
    if(!place(t, idx)) parked.push(t);
  }
  for(const t of undated){ if(!place(t,0)) parked.push(t); }
  return {board, parked, days};
}
function smkHH(v){ return fmt12h(pad2(Math.floor(v/60))+':'+pad2(v%60)); }
RENDER.smart = function(){
  const plan = smkPlan();
  const todayMin = SMK_SLOTS.reduce((s,[slot])=>s+plan.board[0][slot].reduce((a,x)=>a+x.est,0),0);
  const openN = db.tasks.filter(t=>!t.done).length;
  const cols = plan.days.map((dIso,di)=>{
    const d = fromIso(dIso);
    const isToday = di===0;
    const recs = db.recurring.filter(r=>recDueOn(r,dIso));
    const blocks = SMK_SLOTS.map(([slot,,cap])=>{
      let cur = SMK_SLOTS.find(s=>s[0]===slot)[1];
      const rows = plan.board[di][slot].map(({t,est})=>{
        const s=cur, e=cur+est; cur=e;
        return `<div class="smk-row ${quadOf(t)}">
          <label class="check"><input type="checkbox" data-chg="task-done" data-id="${t.id}" aria-label="done"><span class="box"></span></label>
          <span class="smk-time">${smkHH(s)}–${smkHH(e)}</span>
          <span class="smk-lab" title="${esc(t.label)}">${esc(t.label)}</span></div>`;
      }).join('');
      const used = plan.board[di][slot].reduce((a,x)=>a+x.est,0);
      return `<div class="wk-block wb-${slot} smk-block"><span class="wb-cap">${SMK_LAB[slot]} · ${used}/${cap}m</span>${rows||'<span class="smk-free">free space — rest is productive too</span>'}</div>`;
    }).join('');
    return `<div class="wk-col ${isToday?'today-col':''}">
      <div class="wk-head"><span class="wd">${DOW_SHORT[(d.getDay()+6)%7]}</span><span class="wn">${d.getDate()}</span>${isToday?'<span class="pill gold" style="margin-left:auto">today</span>':''}</div>
      <div class="wk-body">${recs.map(r=>`<div class="wk-block wb-recur"><span class="wb-t">↻ ${esc(r.label)}</span><span class="wb-s">${esc(r.cat||'recurring')}</span></div>`).join('')}${blocks}</div></div>`;
  }).join('');
  const parkedHtml = plan.parked.map(t=>taskRowHTML(t)).join('')||'<div class="empty">everything fits — nothing parked ✿</div>';
  $('view-smart').innerHTML = `
    ${viewHead('Your day, pre-decided','Smart Task <em>Schedule</em>',
      `<b>${openN}</b> open tasks · today carries <b>${todayMin} min</b> of focus · overdue lands first, hardest thing in the morning`,
      `<button class="btn btn-primary" data-act="smart-replan">${icon('check')} Re-plan week</button>`)}
    <div class="panel plain"><div class="wk-scroll" style="padding:14px"><div class="wk-grid">${cols}</div></div></div>
    <div class="panel" style="margin-top:16px">
      <div class="panel-head"><span class="card-title">Parked — didn't fit this week</span><span class="card-sub">${plan.parked.length} waiting</span></div>
      ${parkedHtml}
      <div class="view-sub" style="margin-top:10px">The plan rebuilds itself from due dates, priority quadrants and your estimates (set them in Task Manager). Nothing is deleted — overflow simply waits here. Tap a checkbox to finish a task straight from the plan.</div>
    </div>`;
};

function simulateDebt(){
  const list = db.debts.map(d=>({name:d.name, bal:d.balance, apr:d.rate||0, min:d.minPay||0, id:d.id}));
  const extra = Math.max(0, num(db.debtSim.extra,0)||0);
  let totalMin = list.reduce((s,d)=>s+d.min,0);
  let month = 0, interest = 0, alive = list.filter(d=>d.bal>0).length;
  const order = []; const series = [{m:0, total:list.reduce((s,d)=>s+d.bal,0)}];
  const sorted = list.slice().sort((a,b)=> db.debtSim.strategy==='avalanche'? (b.apr-a.apr):(a.bal-b.bal));
  const paidOff = {};
  while(alive>0 && month<600){
    month++;
    const budget = totalMin + extra;
    // interest accrual
    for(const d of list){ if(d.bal<=0) continue; const i = d.bal*d.apr/1200; d.bal += i; interest += i; }
    // minimum payments
    let pool = budget;
    for(const d of list){ if(d.bal<=0) continue;
      const pay = Math.min(d.min, d.bal, pool); d.bal -= pay; pool -= pay; }
    // extra to focus target
    for(const d of sorted){ if(pool<=0) break; if(d.bal<=0) continue;
      const pay = Math.min(pool, d.bal); d.bal -= pay; pool -= pay; }
    for(const d of list){
      if(d.bal<=0 && !paidOff[d.id]){ paidOff[d.id]=month; order.push({name:d.name, month}); alive--; }
    }
    if(month%3===0 || alive===0) series.push({m:month, total:list.reduce((s,d)=>s+Math.max(0,d.bal),0)});
  }
  const freeDate = addM(TODAY, month);
  return {month, interest, paid: series.length? series[series.length-1].total + interest : 0, freeDate, order, series};
}

  const costOf = name => { const m=(db.mealLib||[]).find(x=>x.name.toLowerCase()===String(name||'').toLowerCase()); return m&&m.cost>0?m.cost:null; };
  let weekCost=0;
  const costChips = days.map(d=>{ const r=db.meals.dates[iso(d)]||{}; let s=0,any=false;

  db.meals.dates[dIso][el.dataset.k] = el.value.trim();

};
ACT['meal-prev'] = () => { mealCur = addD(mealCur,-7); RENDER.meals(); };
ACT['meal-next'] = () => { mealCur = addD(mealCur, 7); RENDER.meals(); };
ACT['meal-today'] = () => { mealCur = startOfWeek(TODAY,1); RENDER.meals(); };
ACT['meal-clear'] = el => armDelete(el, () => {
  const days = Array.from({length:7},(_,i)=>iso(addD(mealCur,i)));
  for(const dIso of days) delete db.meals.dates[dIso];
  save(); toast('Week cleared'); RENDER.meals();
});
ACT['meal-autofill'] = () => {
  const lib = db.mealLib||[];
  if(!lib.length){ toast('Add some dishes in Meal Setup first'); return; }
  let filled=0;
  for(let i=0;i<7;i++){
    const dIso = iso(addD(mealCur,i));
    if(!db.meals.dates[dIso]) db.meals.dates[dIso]={};
    const rec = db.meals.dates[dIso];
    MS_SLOTS.forEach(([k],si)=>{
      if(rec[k]) return;
      const pool = lib.filter(m=>m.slot===k);
      if(!pool.length) return;
      rec[k] = pool[(i*2+si)%pool.length].name;
      filled++;
    });
  }
  save();
  toast(filled? ('Auto-filled '+filled+' slot'+(filled===1?'':'s')+' from Meal Setup') : 'Week already fully planned');
  RENDER.meals();
};

/* ============================================================
   MODULE: Weight Tracker — Metric & Imperial (one synced log)
   ============================================================ */
const KG2LB = 2.2046226218;
function wtSorted(){ return db.weights.slice().sort((a,b)=> a.date<b.date?-1:1); }
function bmiOf(kg){ const h=(db.settings.heightCm||0)/100; return h>0? Math.round(kg/(h*h)*10)/10 : null; }
function bmiBand(b){ return b==null?'' : b<18.5?'underweight' : b<25?'healthy range' : b<30?'overweight' : 'obese range'; }
function cmToFtIn(cm){ const t=cm/2.54; const ft=Math.floor(t/12); const inch=Math.round(t-ft*12); return inch===12?[ft+1,0]:[ft,inch]; }
function ftInToCm(ft,inch){ return Math.round((ft*12+inch)*2.54*10)/10; }
function wtKpis(unit){
  const s = wtSorted();
  const latest = s[s.length-1], prev = s[s.length-2];
  const fmtW = kg => unit==='kg'? (Math.round(kg*10)/10)+' kg' : (Math.round(kg*KG2LB*10)/10)+' lb';
  const delta = latest&&prev? Math.round((latest.kg-prev.kg)*(unit==='kg'?1:KG2LB)*10)/10 : null;
  const bmi = latest? bmiOf(latest.kg) : null;
  const gw = db.settings.goalWeightKg;
  const toGoal = latest&&gw? Math.round((latest.kg-gw)*(unit==='kg'?1:KG2LB)*10)/10 : null;
  return {s, latest, prev, fmtW, delta, bmi, toGoal};
}
function wtView(unit){
  const K = wtKpis(unit);
  const isM = unit==='kg';
  const labels = K.s.slice(-10).map(e=>fmtDate(e.date));
  const vals = K.s.slice(-10).map(e=> isM? Math.round(e.kg*10)/10 : Math.round(e.kg*KG2LB*10)/10);
  const rows = K.s.slice().reverse().map(e=>{
    const shown = isM? (Math.round(e.kg*10)/10)+' kg' : (Math.round(e.kg*KG2LB*10)/10)+' lb';
    const bmi = bmiOf(e.kg);
    return `<tr><td>${fmtDateY(e.date)}</td><td><b>${shown}</b></td><td class="num">${bmi!=null?bmi:'—'}</td>
      <td class="ctr"><button class="icon-btn" data-act="wt-del" data-id="${e.id}">${icon('trash')}</button></td></tr>`;
  }).join('') || '<tr><td colspan="4"><div class="empty">no entries yet — log your starting point today</div></td></tr>';
  const [hFt,hIn] = cmToFtIn(db.settings.heightCm||0);
  const goalShown = db.settings.goalWeightKg ? (isM? db.settings.goalWeightKg+' kg' : Math.round(db.settings.goalWeightKg*KG2LB)+' lb') : null;
  return `
    ${viewHead(isM?'Kilograms · centimetres':'Pounds · feet & inches', `Weight <em>Tracker</em> — ${isM?'Metric':'Imperial'}`,
      isM? `One log, both views — imperial entries appear here converted automatically` :
           `One log, both views — everything is stored in kg and shown in lb (${hFt}′${hIn}″ height kept in sync)`,
      `<div class="seg"><button data-act="wt-unit" data-u="kg" class="${isM?'on':''}">Metric · kg</button><button data-act="wt-unit" data-u="lb" class="${!isM?'on':''}">Imperial · lb</button></div>`)}
    <div class="kpis" style="grid-template-columns:repeat(4,1fr)">
      <div class="kpi k-blue"><span class="kico"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M12 7l3.5 4"/></svg></span>
        <b>${K.latest? K.fmtW(K.latest.kg):'—'}</b><span>latest weight</span></div>
      <div class="kpi ${K.delta&&K.delta<0?'k-teal':'k-peach'}"><span class="kico"><svg viewBox="0 0 24 24"><path d="M3 6l7 7 4-3 7 7"/><path d="M21 12v5h-5"/></svg></span>
        <b>${K.delta!=null? (K.delta>0?'+':'')+K.delta+' '+(isM?'kg':'lb'):'—'}</b><span>vs previous entry</span></div>
      <div class="kpi k-violet"><span class="kico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
        <b>${K.bmi!=null?K.bmi:'—'}</b><span>BMI · ${K.bmi!=null?bmiBand(K.bmi):'add height'}</span></div>
      <div class="kpi k-pink"><span class="kico"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h13l-2.5 4L18 12H5"/></svg></span>
        <b>${K.toGoal!=null? (K.toGoal>0?K.toGoal+' '+(isM?'kg':'lb')+' to go':'goal ✓'):(goalShown||'—')}</b><span>goal weight${K.toGoal!=null&&K.toGoal<=0?' reached':''}</span></div>
    </div>
    <div class="wt-grid">
      <div class="railbox">
        <div class="panel">
          <div class="panel-head"><span class="card-title">Add an entry</span></div>
          <div class="form-grid">
            <div class="field"><span>DATE</span><input class="in" type="date" id="wtDate" value="${todayIso()}"></div>
            ${isM
              ? `<div class="field"><span>WEIGHT (KG)</span><input class="in" type="number" step="0.1" min="0" id="wtVal" placeholder="e.g. 69.5"></div>`
              : `<div class="field"><span>WEIGHT (LB)</span><input class="in" type="number" step="0.2" min="0" id="wtVal" placeholder="e.g. 153.2"></div>`}
          </div>
          <div style="display:flex;justify-content:flex-end;margin-top:12px">
            <button class="btn btn-primary" data-act="wt-add" data-u="${unit}">${icon('plus')} Save weigh-in</button></div>
        </div>
        <div class="panel">
          <div class="panel-head"><span class="card-title">Body settings</span></div>
          ${isM? `
            <div class="form-grid">
              <div class="field"><span>HEIGHT (CM)</span><input class="in" type="number" min="80" max="250" value="${db.settings.heightCm||''}" data-inp="wt-height" data-u="cm"></div>
              <div class="field"><span>GOAL WEIGHT (KG)</span><input class="in" type="number" step="0.1" min="0" value="${db.settings.goalWeightKg||''}" data-inp="wt-goal" data-u="kg"></div>
            </div>`
          : `
            <div class="form-grid">
              <div class="field"><span>HEIGHT</span><div style="display:flex;gap:7px">
                <input class="in" type="number" min="2" max="8" value="${hFt}" data-inp="wt-height-ft" title="feet" placeholder="ft">
                <input class="in" type="number" min="0" max="11" value="${hIn}" data-inp="wt-height-ft" title="inches" placeholder="in"></div></div>
              <div class="field"><span>GOAL WEIGHT (LB)</span><input class="in" type="number" step="1" min="0" value="${db.settings.goalWeightKg?Math.round(db.settings.goalWeightKg*KG2LB):''}" data-inp="wt-goal" data-u="lb"></div>
            </div>`}
          <div class="bmi-chip" style="margin-top:10px">BMI <b>${K.bmi!=null?K.bmi:'—'}</b> ${K.bmi!=null?'· '+bmiBand(K.bmi):'· add height to calculate'}</div>
        </div>
      </div>
      <div class="railbox">
        <div class="panel">
          <div class="panel-head"><span class="card-title">Trend · last 10 weigh-ins (${isM?'kg':'lb'})</span></div>
          <div class="wt-chart">${lineChart({w:440,h:190,vals,labels,color:'var(--chart-line)',fmt:v=>Math.round(v*10)/10})}</div>
        </div>
        <div class="panel">
          <div class="panel-head"><span class="card-title">Weigh-in log</span><span class="card-sub">${K.s.length} entries</span></div>
          <div style="overflow-x:auto"><table class="tbl">
            <thead><tr><th>Date</th><th>Weight</th><th class="num">BMI</th><th></th></tr></thead>
            <tbody>${rows}</tbody></table></div>
        </div>
      </div>
    </div>`;
}

ACT['wt-add'] = el => {

};
ACT['wt-del'] = el => { db.weights = db.weights.filter(w=>w.id!==el.dataset.id); save(); toast('Entry removed'); refresh(); };

INP['wt-goal']   = el => { let v = num(el.value, NaN);

/* ============================================================
   MODULE: Hydration Tracker
   ============================================================ */
RENDER.hydration = function(){
  const t = todayIso(), goal = db.settings.hydrGoal||8;
  const got = db.hydration[t]||0;
  const days14 = Array.from({length:14},(_,i)=>iso(addD(TODAY,-13+i)));
  const vals = days14.map(d=>db.hydration[d]||0);
  const week = vals.slice(-7), weekAvg = Math.round(week.reduce((s,v)=>s+v,0)/7*10)/10;
  const monthVals = Object.keys(db.hydration).filter(k=>k.startsWith(todayIso().slice(0,7))).map(k=>db.hydration[k]);
  const best = monthVals.length? Math.max(...monthVals, 0):0;
  let streak=0;
  for(let i=0;i<60;i++){ if((db.hydration[iso(addD(TODAY,-i))]||0)>=goal) streak++; else if(i>0) break; }
  const pct = clamp(Math.round(got/goal*100),0,100);
  const kpi=(cls,ic,v,l)=>`<div class="kpi ${cls}"><span class="kico"><svg viewBox="0 0 24 24">${ic}</svg></span><b>${v}</b><span>${l}</span></div>`;
  $('view-hydration').innerHTML = `
    ${viewHead('The easiest win of the day','Hydration <em>Tracker</em>',
      got>=goal? 'Goal reached today — beautifully done ✿' : `<b>${goal-got}</b> glasses to go today`,
      `<button class="btn" data-act="hy-goal">${icon('edit')} Daily goal</button>`)}
    <div class="panel" style="margin-bottom:18px">
      <div class="hy-hero">
        <span class="glass-xl ${got>=goal?'full':''}" style="--lvl:${pct}%"></span>
        <div style="flex:1;min-width:220px">
          <div class="ov">today</div>
          <div style="font-family:var(--serif);font-size:clamp(26px,3vw,34px);color:var(--ink)">${got} <span style="font-size:14px;color:var(--muted)">of ${goal} glasses · ${pct}%</span></div>
          <div class="hy-taps" style="margin-top:12px">
            ${Array.from({length:goal},(_,i)=>`<button class="glass ${i<got?'full':''}" style="--lvl:${Math.round(clamp(got-i,0,1)*100)}%" data-act="hy-tap" data-n="${i+1}" aria-label="fill to ${i+1}"></button>`).join('')}
            <button class="btn btn-sm btn-primary" data-act="hy-plus" style="margin-left:6px">${icon('plus')} One glass</button>
          </div>
        </div>
      </div>
    </div>
    <div class="kpis" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px">
      ${kpi('k-blue','<path d="M12 3 7.5 9.5a6 6 0 1 0 9 0z"/>', got,'glasses today')}
      ${kpi('k-teal','<path d="M3 18l7-7 4 3 7-7"/><path d="M21 12V7h-5"/>', weekAvg,'7-day avg')}
      ${kpi('k-peach','<path d="m5 12.5 4.5 4.5L19 7.5"/>', best,'best day · month')}
      ${kpi('k-pink','<path d="M12 3s5 4.5 5 9a5 5 0 0 1-10 0c0-1.8.8-3.4 1.7-4.6C9.3 8.7 10 9.8 10.5 11 11.5 8.5 11 5.5 12 3z"/>', streak<0?0:streak+'d','goal streak')}
    </div>
    <div class="panel">
      <div class="panel-head"><span class="card-title">Last 14 days</span></div>
      ${vbars({w:420,h:150,vals,labels:days14.map(d=>fromIso(d).getDate()+''),color:'var(--pp1)',colorFn:v=>v>=goal?'#6E93B4':'var(--pp1)',goal,fmt:v=>v+' glasses'})}
    </div>`;
};
ACT['hy-tap'] = el => { const t=todayIso(), n=Number(el.dataset.n);
  const cur = db.hydration[t]||0;
  db.hydration[t] = (n===cur)? n-1 : n;
  if(db.hydration[t]<=0) delete db.hydration[t];
  save();
  const goal=db.settings.hydrGoal||8;
  if(db.hydration[t]===goal){ confettiAt(el); toast('Hydration goal reached — brain says thanks ✿'); }
  refresh(); };
ACT['hy-plus'] = () => { const t=todayIso();
  db.hydration[t] = (db.hydration[t]||0)+1;
  save();
  const goal=db.settings.hydrGoal||8;
  if(db.hydration[t]===goal){ confettiCenter(); toast('Hydration goal reached ✿'); }
  refresh(); };
ACT['hy-goal'] = () => {
  openModal(`<h3>Daily <em>hydration goal</em></h3>
    <div class="field"><span>GLASSES PER DAY (250 ml each)</span><input class="in" type="number" min="4" max="14" id="mHyGoal" value="${db.settings.hydrGoal||8}"></div>
    <div class="modal-actions"><button class="btn" data-act="modal-close">Cancel</button>
    <button class="btn btn-primary" data-act="hy-goal-save">Save goal</button></div>`);
};
ACT['hy-goal-save'] = () => { db.settings.hydrGoal = clamp(Math.round(num($('mHyGoal').value,8)||8),4,14);
  save(); closeModal(); toast('Goal updated'); RENDER.hydration(); updateBadges(); };

/* ============================================================
   BOOT
   ============================================================ */
/* ============================================================
   DEMO MODE — one codebase, two versions (flip DEMO_MODE at the top)
   1) 40-entry limit on the open modules (Budget, Habits, Recurring), one calm message at the limit
   2) Task Manager, Savings, Fitness, Smart Schedule, Goals, Debt, Meals, Grocery, Weight and Hydration are locked: blurred
      preview behind a lock card. Everything already typed stays readable.
   ============================================================ */
const DEMO_LOCKED = {
  priority:'Task Manager', savings:'Savings Goals', fitness:'Fitness Tracker',
  smart:'Smart Task Schedule', goals:'Goal Planner', debt:'Debt Payoff Calculator',
  mealsetup:'Meal Setup', meals:'Weekly Meal Planner', grocery:'Grocery List',
  weight:'Weight Tracker', hydration:'Hydration'
};
const LOCK_PATH = '<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>';
function demoUsed(){ try{ return parseInt(localStorage.getItem(DEMO_KEY),10)||0; }catch(e){ return 0; } }
function demoAdd(n){ try{ localStorage.setItem(DEMO_KEY, String(demoUsed()+n)); }catch(e){} }
function recordCount(){
  const hab = Object.values(db.habits.months).reduce((n,m)=>n+m.habits.length,0);
  return db.goals.length + db.recurring.length + db.budget.log.length + db.budget.cats.length
    + db.debts.length + db.weights.length + db.grocery.length + db.mealLib.length + hab;
}
function demoBadge(){
  if(!DEMO_MODE) return;
  let b = $('demoBadge');
  if(!b){
    b = document.createElement('a');
    b.id = 'demoBadge'; b.className = 'mast-date';
    b.href = BUY_URL; b.target = '_blank'; b.rel = 'noopener noreferrer';
    b.style.textDecoration = 'none';
    const md = $('mastDate'); md.parentNode.insertBefore(b, md);
  }
  b.textContent = 'FREE DEMO · ' + Math.max(0, DEMO_LIMIT - demoUsed()) + ' entries left';
}
function demoLimitModal(){
  openModal(`<h3>Demo <em>limit reached</em></h3>
    <div class="view-sub" style="font-size:12.5px;line-height:1.65;color:var(--ink2)">You have added ${DEMO_LIMIT} entries, enough to feel how the planner works. Everything you typed stays here and stays readable. The full planner has no limits.</div>
    <div class="modal-actions"><button class="btn" data-act="modal-close">Keep exploring</button>
    <a class="btn btn-primary" style="text-decoration:none" href="${BUY_URL}" target="_blank" rel="noopener noreferrer">Get the full planner</a></div>`);
}
function demoFeatureModal(name){
  openModal(`<h3>${name} <em>is in the full planner</em></h3>
    <div class="view-sub" style="font-size:12.5px;line-height:1.65;color:var(--ink2)">This part is locked in the free demo. Budget, habits, calendar and recurring tasks are yours to try.</div>
    <div class="modal-actions"><button class="btn" data-act="modal-close">Keep exploring</button>
    <a class="btn btn-primary" style="text-decoration:none" href="${BUY_URL}" target="_blank" rel="noopener noreferrer">Unlock the full planner</a></div>`);
}
function demoGuard(fn){
  return function(){
    if(!DEMO_MODE) return fn.apply(this, arguments);
    if(demoUsed() >= DEMO_LIMIT){ demoLimitModal(); return; }
    const before = recordCount();
    const out = fn.apply(this, arguments);
    const delta = recordCount() - before;
    if(delta > 0){ demoAdd(delta); demoBadge(); }
    return out;
  };
}
function demoLock(name, fn){
  return function(){
    if(!DEMO_MODE) return fn.apply(this, arguments);
    demoFeatureModal(name);
  };
}
/* limit: open modules */
['rec-add','rec-save','bud-exp','bud-inc-add','bud-inc-save','bud-cat-add','hab-add','hab-add-save'
].forEach(k => { if(ACT[k]) ACT[k] = demoGuard(ACT[k]); });
/* lock: creating or editing anything in the three locked modules, from anywhere */
const LOCK_ACTS = {
  'Task Manager':    ['task-add','task-edit','task-save','cal-add-task','q-add'],
  'Savings Goals':   ['sav-add','sav-edit','sav-save','sav-dep'],
  'Fitness Tracker': ['fit-add','fit-goal','fit-goal-save'],
  'Smart Task Schedule': ['smart-replan'],
  'Goal Planner': ['goal-add','goal-edit','goal-save','goal-achieve'],
  'Debt Payoff Calculator': ['debt-add','debt-edit','debt-save'],
  'Meal Setup': ['msl-add'],
  'Weekly Meal Planner': ['meal-autofill'],
  'Grocery List': ['gr-add'],
  'Weight Tracker': ['wt-add'],
  'Hydration': ['hy-tap','hy-plus','hy-goal','hy-goal-save']
};
Object.keys(LOCK_ACTS).forEach(name => LOCK_ACTS[name].forEach(k => { if(ACT[k]) ACT[k] = demoLock(name, ACT[k]); }));
qAdd = demoLock('Task Manager', qAdd);
grAdd = demoLock('Grocery List', grAdd);
/* locked pages: blurred preview behind a lock card */
if(DEMO_MODE){
  Object.keys(DEMO_LOCKED).forEach(v => {
    const orig = RENDER[v];
    RENDER[v] = function(){
      orig();
      const host = $('view-' + v), name = DEMO_LOCKED[v];
      host.innerHTML = `<div class="demo-lock-wrap">
        <div class="demo-lock-content" inert aria-hidden="true">${host.innerHTML}</div>
        <div class="demo-lock-card">
          <div class="demo-lock-badge"><svg viewBox="0 0 24 24">${LOCK_PATH}</svg></div>
          <h3>${name} <em>is in the full planner</em></h3>
          <p>The free demo lets you try the Dashboard, Budget, Habits, Calendar and Recurring Tasks. ${name} unlocks in the full version, with no limits and no subscription.</p>
          <div class="demo-lock-actions">
            <a class="btn btn-primary" style="text-decoration:none" href="${BUY_URL}" target="_blank" rel="noopener noreferrer">Unlock the full planner</a>
            <button class="btn" data-act="go" data-to="dashboard">Back to dashboard</button>
          </div></div></div>`;
    };
    document.querySelectorAll('.pnav-item[data-view="' + v + '"], .more-item[data-view="' + v + '"]').forEach(b => {
      b.insertAdjacentHTML('beforeend', `<svg class="demo-lock-ico" viewBox="0 0 24 24" aria-label="locked in demo">${LOCK_PATH}</svg>`);
    });
  });
}
demoBadge();

$('pnav').addEventListener('click', e => {
  const b = e.target.closest('[data-view]'); if(!b) return;
  showView(b.dataset.view);
});
document.addEventListener('click', e => {
  const wrap = $('navMoreWrap');
  if(wrap && !wrap.classList.contains('open')){ /* fast path */ }
  if(wrap && wrap.classList.contains('open') && !e.target.closest('#navMoreWrap')){
    wrap.classList.remove('open');
    const mBtn=$('navMore'); if(mBtn) mBtn.setAttribute('aria-expanded','false');
  }
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = ACT[el.dataset.act];
  if(fn){ fn(el, e); }
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-inp]'); if(!el) return;
  const fn = INP[el.dataset.inp]; if(fn) fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]'); if(!el) return;
  const fn = CHG[el.dataset.chg]; if(fn) fn(el, e);
});
function setTheme(t){
  db.theme = t; document.documentElement.setAttribute('data-theme', t); save();
  $$('.theme-dot').forEach(d=>d.classList.toggle('active', d.dataset.themeSet===t));
}
$$('.theme-dot').forEach(d => d.addEventListener('click', () => { setTheme(d.dataset.themeSet); toast('Mood: '+d.title.split('—')[0].trim()); }));
$$('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.themeSet===(db.theme||'sage')));
$('mastDate').textContent = new Date().toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric', year:'numeric'});
updateBadges();
showView('dashboard');

</script>
